name: WORK-05 offline KMeans verification
on:
  push:
    branches: [work-05-kmeans-audit]
permissions:
  contents: read
jobs:
  offline-verify:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0
      - run: python -m unittest tests.test_kmeans_audit tests.test_offline_integration -v
      - run: python -m unittest discover -s fcg_ia5/tests -v
      - run: python -m unittest discover -s fcg_paper_faithful/tests -v
