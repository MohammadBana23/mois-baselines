name: Offline Windows dependencies
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  wheels:
    if: github.head_ref == 'work05-delivery-preflight'
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -m pip download --only-binary=:all: --dest wheels numpy==2.3.5 scikit-learn==1.8.0 scipy==1.18.1 joblib==1.6.0 threadpoolctl==3.8.0 cloudpickle==3.1.3
      - uses: actions/upload-artifact@v4
        with:
          name: ia5-windows-wheels
          path: wheels
          retention-days: 1
